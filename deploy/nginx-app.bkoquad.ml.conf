# BKO Quad Hub — extension Nginx pour app.bkoquad.ml (aaPanel / VPS).
#
# Le vhost app.bkoquad.ml.conf (SSL, .well-known, logs) est géré par le panel :
# NE PAS l'écraser. Placer ce fichier dans :
#   /www/server/panel/vhost/nginx/extension/app.bkoquad.ml/bko-proxy.conf
# puis :
#   nginx -t && nginx -s reload
#
# Hors aaPanel, inclure ce bloc dans le server { ... } du vhost :
#   /etc/nginx/sites-available/app.bkoquad.ml.conf
#
# Le conteneur web écoute uniquement sur 127.0.0.1:8003 (docker-compose.prod.yml).

client_max_body_size 15M;

# Sécurité (héritée par les locations sans add_header).
# HSTS est ajouté par Django (SecurityMiddleware) pour tous les passages proxy.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Sonde Docker / supervision.
location = /healthz {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

location = /healthz/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

location = /api/v1/payments/webhook {
    return 404;
}

location = /api/v1/payments/webhook/ {
    return 404;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
}

location ^~ /static/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
}

# APK Android servis depuis le build Vite : forcer le téléchargement.
location ^~ /apks/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires 1h;
}

location ^~ /assets/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
